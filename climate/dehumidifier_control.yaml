blueprint:
  name: "Smart Dehumidifier Control"
  description: |
    **Version**: 3.0

    Controls a dehumidifier with your own room sensor instead of the
    device's built-in hygrostat, and recommends window ventilation whenever
    the outdoor air would dry the room better:

    - Turns on above the target humidity and off below the turn-off
      threshold, with an emergency threshold for mold protection.
    - Compares indoor and outdoor air via the dew point: ventilation is
      recommended when the outdoor air, warmed to room temperature, would be
      noticeably drier than the room air.
    - Only recommends ventilation while someone is home, when it will not
      heat the room above your comfort temperature and when the room is
      warm enough.
    - Optional actions (e.g. notifications): "please ventilate" and "close
      the window" (air exchanged, room getting cold, or a maximum time that
      depends on the outdoor temperature).
    - If nobody opens a window in time, the dehumidifier takes over.
    - Turns off while a window or door is open.
    - Optional emergency operation with open windows or outside the time
      window.
    - Compressor protection with minimum run and off times.
    - Optional active time window and override of the device's hygrostat.

    Found a bug or have a suggestion? Open an issue on GitHub:
    https://github.com/Spegeli/homeassistant-blueprints/issues
  domain: automation
  homeassistant:
    min_version: 2024.8.0
  input:
    humidifier_entity:
      name: Dehumidifier
      description: "Select the dehumidifier entity (domain: humidifier)"
      selector:
        entity:
          domain: humidifier

    override_device_hygrostat:
      name: Override the Device's Hygrostat
      description: >
        Sets the device's target humidity to its minimum every time the
        automation turns it on, so only your room sensor decides when it
        stops. Useful when the built-in sensor sits in the device's own dry
        exhaust air and stops too early.
      default: false
      selector:
        boolean:

    indoor_sensors:
      name: Indoor Sensors
      icon: mdi:home-thermometer
      collapsed: false
      input:
        indoor_rh_sensor:
          name: Indoor – Relative Humidity
          description: Room humidity sensor (%). Controls the dehumidifier.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity

        indoor_temp_sensor:
          name: Indoor – Temperature (optional)
          description: >
            Room temperature sensor (°C), ideally the same device as the
            humidity sensor. Needed for ventilation recommendations. Without
            it the dehumidifier is controlled by humidity only, and the "close
            the window" actions only use the maximum ventilation time.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature

    outdoor_sensors:
      name: Outdoor Sensors (optional)
      icon: mdi:weather-partly-cloudy
      collapsed: true
      description: >
        Needed for ventilation recommendations. Sensors of a weather service
        (for example DWD) are fine. Leave both empty to control the
        dehumidifier on indoor humidity only.
      input:
        outdoor_rh_sensor:
          name: Outdoor – Relative Humidity (optional)
          description: Outdoor humidity sensor (%).
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity

        outdoor_temp_sensor:
          name: Outdoor – Temperature (optional)
          description: >
            Outdoor temperature sensor (°C). Also sets the maximum ventilation
            time of the "close the window" actions.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature

    windows_doors:
      name: Windows & Doors
      icon: mdi:window-open
      collapsed: true
      input:
        window_door_sensors:
          name: Window/Door Sensors (optional)
          description: >
            One or more window or door sensors. While at least one reports
            "open", the dehumidifier is turned off. Also used for the "close
            the window" actions.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class: window
                - domain: binary_sensor
                  device_class: door
                - domain: binary_sensor
                  device_class: opening

        critical_ignores_windows:
          name: Emergency Also With Open Windows
          description: >
            When enabled, the dehumidifier also runs while a window or door is
            open once the critical humidity is reached. It keeps running until
            the humidity is 2 points below the critical humidity.
          default: false
          selector:
            boolean:

    thresholds:
      name: Thresholds & Compressor
      icon: mdi:tune
      collapsed: true
      input:
        target_rh:
          name: Target Humidity (%)
          description: >
            Dehumidification (or a ventilation recommendation) starts at this
            room humidity.
          default: 55
          selector:
            number:
              min: 40
              max: 90
              step: 1
              unit_of_measurement: "%"
              mode: slider

        turn_off_rh:
          name: Turn-off Threshold – Hysteresis (%)
          description: >
            The dehumidifier only turns off once the room humidity drops below
            this value. Must be lower than the target humidity to prevent
            rapid cycling.
          default: 50
          selector:
            number:
              min: 30
              max: 85
              step: 1
              unit_of_measurement: "%"
              mode: slider

        critical_rh:
          name: Critical Humidity – Emergency Override (%)
          description: >
            From this room humidity on, the dehumidifier turns on regardless
            of outdoor conditions or presence (mold protection). Open windows
            and the time window still stop it, unless the emergency options
            are enabled.
          default: 60
          selector:
            number:
              min: 50
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        min_run_time:
          name: Minimum Run Time (minutes)
          description: >
            Once on, the dehumidifier runs at least this long before it turns
            off because the humidity dropped. Short cycles cost efficiency.
            An open window or the end of the time window still turns it off
            immediately. 0 = disabled.
          default: 15
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: "min"
              mode: slider

        min_off_time:
          name: Minimum Off Time (minutes)
          description: >
            The dehumidifier must remain off for at least this duration before
            it can turn on again. Protects the compressor from short cycling.
            Recommended: 5 minutes.
          default: 5
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: "min"
              mode: slider

    presence:
      name: Presence
      icon: mdi:account-multiple
      collapsed: true
      input:
        presence_sensors:
          name: Presence Sensors (optional)
          description: >
            One or more person entities or presence/occupancy binary sensors.
            Ventilation is only recommended while someone is home, otherwise
            the dehumidifier runs. Leave empty to assume someone is always
            home.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: person
                - domain: binary_sensor
                  device_class: presence
                - domain: binary_sensor
                  device_class: occupancy

    ventilation_logic:
      name: Ventilation
      icon: mdi:air-filter
      collapsed: true
      description: >
        Needs the indoor temperature, both outdoor sensors and the "please
        ventilate" actions. Without these actions nobody would know about the
        recommendation, so the dehumidifier never waits for ventilation.
      input:
        min_drying_effect:
          name: Minimum Drying Effect (percentage points)
          description: >
            Ventilation is recommended when the outdoor air, warmed to room
            temperature, would be at least this many percentage points drier
            than the room air. Example: room 55 %, outdoor air would have
            47 % in the room = 8 points.
          default: 6
          selector:
            number:
              min: 2
              max: 20
              step: 1
              unit_of_measurement: "%"
              mode: slider

        max_comfort_temp:
          name: Maximum Comfort Temperature (°C)
          description: >
            Ventilation must not heat the room above your comfort level: it is
            only recommended when the outdoor temperature is at most this
            value or at most the indoor temperature.
          default: 20
          selector:
            number:
              min: 15
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

        min_indoor_temp:
          name: Minimum Room Temperature (°C)
          description: >
            No ventilation recommendation below this room temperature, so the
            walls do not cool down in winter. Falling below it while a window
            is open also runs the "close the window" actions.
          default: 18
          selector:
            number:
              min: 10
              max: 24
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

        ventilation_wait_time:
          name: Wait Time for Ventilation (minutes)
          description: >
            If nobody opens a window within this time after the
            recommendation, the dehumidifier takes over.
          default: 30
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: "min"
              mode: slider

        ventilate_actions:
          name: '"Please Ventilate" Actions'
          description: >
            Run once when ventilation becomes recommended, e.g. a notification.
            Available variables: indoor_humidity, drying_potential.
          default: []
          selector:
            action: {}

        close_actions:
          name: '"Close the Window" Actions'
          description: >
            Run once per opening when a window should be closed again: the air
            is exchanged (or the outdoor air is not drier), the room falls
            below the minimum temperature, or the window has been open for
            5 min (below 5 °C outside), 10 min (below 10 °C), 15 min (below
            15 °C), 20 min (below 20 °C) or 25 min.
          default: []
          selector:
            action: {}

    time_window:
      name: Time Window
      icon: mdi:clock-outline
      collapsed: true
      input:
        enable_time_check:
          name: Enable Time Window?
          description: >
            When enabled, the dehumidifier only runs and actions only run
            between the start and end time. Outside this window the
            dehumidifier is turned off.
          default: false
          selector:
            boolean:

        start_time:
          name: Start Time
          default: "09:00:00"
          selector:
            time:

        end_time:
          name: End Time
          default: "22:00:00"
          selector:
            time:

        critical_ignores_time_window:
          name: Emergency Also Outside the Time Window
          description: >
            When enabled, the dehumidifier also runs outside the time window
            once the critical humidity is reached. It keeps running until the
            humidity is 2 points below the critical humidity.
          default: false
          selector:
            boolean:

mode: single
max_exceeded: silent

# Inputs for the template triggers below (triggers cannot use the variables section)
trigger_variables:
  _indoor_rh_id: !input indoor_rh_sensor
  _indoor_temp_id: !input indoor_temp_sensor
  _outdoor_temp_id: !input outdoor_temp_sensor
  _outdoor_rh_id: !input outdoor_rh_sensor
  _window_sensors: !input window_door_sensors
  _presence_sensors: !input presence_sensors
  _target_rh: !input target_rh
  _min_drying_effect: !input min_drying_effect
  _max_comfort_temp: !input max_comfort_temp
  _min_indoor_temp: !input min_indoor_temp
  _enable_time_check: !input enable_time_check
  _start_time: !input start_time
  _end_time: !input end_time

trigger:
  - platform: state
    entity_id: !input indoor_rh_sensor
  - platform: state
    entity_id: !input window_door_sensors
  - platform: state
    entity_id: !input presence_sensors
  - platform: time_pattern
    minutes: "/5"

  # Ventilation became recommended → "please ventilate" actions.
  # The drying effect is the room humidity minus the humidity the outdoor air
  # would have at room temperature (Magnus formula, vapour pressure ratio).
  - platform: template
    id: ventilate
    value_template: &ventilation_recommended >-
      {%- set rh_in = states(_indoor_rh_id) -%}
      {%- set t_in = states(_indoor_temp_id) -%}
      {%- set t_out = states(_outdoor_temp_id) -%}
      {%- set rh_out = states(_outdoor_rh_id) -%}
      {%- if rh_in | is_number and t_in | is_number
            and t_out | is_number and rh_out | is_number -%}
        {%- set rh_in = rh_in | float -%}
        {%- set t_in = t_in | float -%}
        {%- set t_out = t_out | float -%}
        {%- set drying = rh_in - rh_out | float
              * e ** (17.62 * t_out / (243.12 + t_out) - 17.62 * t_in / (243.12 + t_in)) -%}
        {%- set now_time = now().strftime('%H:%M:%S') -%}
        {%- set in_window = not _enable_time_check
              or ((_start_time <= now_time <= _end_time) if _start_time < _end_time
                  else (now_time >= _start_time or now_time <= _end_time)) -%}
        {%- set home = _presence_sensors | count == 0
              or expand(_presence_sensors) | selectattr('state', 'in', ['home', 'on']) | list | count > 0 -%}
        {%- set window_open = expand(_window_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 -%}
        {{ in_window and home and not window_open
           and rh_in >= _target_rh
           and drying >= _min_drying_effect
           and (t_out <= _max_comfort_temp or t_out <= t_in)
           and t_in >= _min_indoor_temp }}
      {%- else -%}
        false
      {%- endif -%}

  # Recommended for the whole wait time and nobody opened a window → dehumidifier
  - platform: template
    id: ventilate_timeout
    value_template: *ventilation_recommended
    for:
      minutes: !input ventilation_wait_time

  # A window should be closed again → "close the window" actions
  - platform: template
    id: close
    value_template: >-
      {%- set open_windows = expand(_window_sensors) | selectattr('state', 'eq', 'on') | list -%}
      {%- set now_time = now().strftime('%H:%M:%S') -%}
      {%- set in_window = not _enable_time_check
            or ((_start_time <= now_time <= _end_time) if _start_time < _end_time
                else (now_time >= _start_time or now_time <= _end_time)) -%}
      {%- if open_windows | count == 0 or not in_window -%}
        false
      {%- else -%}
        {%- set minutes_open = (now() - open_windows | map(attribute='last_changed') | min).total_seconds() / 60 -%}
        {%- set rh_in = states(_indoor_rh_id) -%}
        {%- set t_in = states(_indoor_temp_id) -%}
        {%- set t_out = states(_outdoor_temp_id) -%}
        {%- set rh_out = states(_outdoor_rh_id) -%}
        {%- set max_minutes = 10 -%}
        {%- if t_out | is_number -%}
          {%- set t = t_out | float -%}
          {%- set max_minutes = 5 if t < 5 else 10 if t < 10 else 15 if t < 15 else 20 if t < 20 else 25 -%}
        {%- endif -%}
        {%- set too_cold = t_in | is_number and t_in | float < _min_indoor_temp
              and (not t_out | is_number or t_out | float < t_in | float) -%}
        {%- set exchanged = false -%}
        {%- if minutes_open >= 3 and rh_in | is_number and t_in | is_number
              and t_out | is_number and rh_out | is_number -%}
          {%- set exchanged = rh_in | float - rh_out | float
                * e ** (17.62 * t_out | float / (243.12 + t_out | float)
                        - 17.62 * t_in | float / (243.12 + t_in | float))
                < _min_drying_effect / 2 -%}
        {%- endif -%}
        {{ minutes_open >= max_minutes or too_cold or exchanged }}
      {%- endif -%}

  # After a restart or reload the wait timer above starts from scratch
  - platform: homeassistant
    event: start
    id: restart
  - platform: event
    event_type: automation_reloaded
    id: restart

variables:
  # Inputs
  _humidifier_id: !input humidifier_entity
  _indoor_rh_id: !input indoor_rh_sensor
  _indoor_temp_id: !input indoor_temp_sensor
  _outdoor_temp_id: !input outdoor_temp_sensor
  _outdoor_rh_id: !input outdoor_rh_sensor
  _window_sensors: !input window_door_sensors
  _presence_sensors: !input presence_sensors
  _target_rh: !input target_rh
  _turn_off_rh: !input turn_off_rh
  _critical_rh: !input critical_rh
  _min_run_time: !input min_run_time
  _min_off_time: !input min_off_time
  _min_drying_effect: !input min_drying_effect
  _max_comfort_temp: !input max_comfort_temp
  _min_indoor_temp: !input min_indoor_temp
  _ventilate_actions: !input ventilate_actions
  _enable_time_check: !input enable_time_check
  _start_time: !input start_time
  _end_time: !input end_time
  _critical_ignores_time_window: !input critical_ignores_time_window
  _critical_ignores_windows: !input critical_ignores_windows
  _override_device_hygrostat: !input override_device_hygrostat

  # Room humidity (the condition below guarantees a valid value)
  indoor_humidity: "{{ states(_indoor_rh_id) | float(0) }}"

  # Percentage points the room humidity could drop by ventilating (for actions)
  drying_potential: >-
    {%- set t_in = states(_indoor_temp_id) -%}
    {%- set t_out = states(_outdoor_temp_id) -%}
    {%- set rh_out = states(_outdoor_rh_id) -%}
    {%- if t_in | is_number and t_out | is_number and rh_out | is_number -%}
      {%- set t_in = t_in | float -%}
      {%- set t_out = t_out | float -%}
      {{ (indoor_humidity - rh_out | float
          * e ** (17.62 * t_out / (243.12 + t_out) - 17.62 * t_in / (243.12 + t_in))) | round(1) }}
    {%- else -%}
      {{ none }}
    {%- endif -%}

  ventilation_recommended: *ventilation_recommended

  # Time window check (supports windows spanning midnight)
  in_time_window: >-
    {%- set now_time = now().strftime('%H:%M:%S') -%}
    {{ not _enable_time_check
       or ((_start_time <= now_time <= _end_time) if _start_time < _end_time
           else (now_time >= _start_time or now_time <= _end_time)) }}

  any_window_open: "{{ expand(_window_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}"

  # Emergency: critical humidity, or still less than 2 points below it while running
  # (prevents on/off cycling around the critical value)
  emergency: >-
    {{ indoor_humidity >= _critical_rh
       or (is_state(_humidifier_id, 'on') and indoor_humidity >= _critical_rh - 2) }}

  # Compressor protection: restart only after the minimum off time
  compressor_ready: >-
    {%- set dehumidifier = states[_humidifier_id] -%}
    {{ dehumidifier is none or dehumidifier.state != 'off'
       or (now() - dehumidifier.last_changed).total_seconds() >= _min_off_time * 60 }}

  # Efficiency: stop because of low humidity only after the minimum run time
  min_run_done: >-
    {%- set dehumidifier = states[_humidifier_id] -%}
    {{ dehumidifier is none or dehumidifier.state != 'on'
       or (now() - dehumidifier.last_changed).total_seconds() >= _min_run_time * 60 }}

condition:
  - condition: template
    value_template: "{{ states(_indoor_rh_id) | is_number }}"

action:
  # User-defined actions (e.g. notifications)
  - choose:
      - conditions: "{{ trigger.id == 'ventilate' }}"
        sequence: !input ventilate_actions
      - conditions: "{{ trigger.id == 'close' }}"
        sequence: !input close_actions

  # Dehumidifier control: the first matching branch wins
  - choose:
      # 1. Outside the time window → off (unless the emergency option applies)
      - conditions: >-
          {{ _enable_time_check and not in_time_window
             and not (_critical_ignores_time_window and emergency) }}
        sequence: &turn_off
          - condition: template
            value_template: "{{ is_state(_humidifier_id, 'on') }}"
          - action: humidifier.turn_off
            target:
              entity_id: !input humidifier_entity

      # 2. Critical humidity → on (with open windows only if that option is enabled)
      - conditions: >-
          {{ indoor_humidity >= _critical_rh and compressor_ready
             and (not any_window_open or _critical_ignores_windows) }}
        sequence: &turn_on
          - condition: template
            value_template: "{{ is_state(_humidifier_id, 'off') }}"
          - action: humidifier.turn_on
            target:
              entity_id: !input humidifier_entity
          - if: "{{ _override_device_hygrostat }}"
            then:
              - action: humidifier.set_humidity
                target:
                  entity_id: !input humidifier_entity
                data:
                  humidity: "{{ state_attr(_humidifier_id, 'min_humidity') | int(0) }}"
                continue_on_error: true

      # 3. Window or door open → off (unless the emergency option applies)
      - conditions: "{{ any_window_open and not (_critical_ignores_windows and emergency) }}"
        sequence: *turn_off

      # 4. Nobody ventilated within the wait time, or restart/reload (the wait
      #    timer does not survive it) → the dehumidifier takes over
      - conditions: >-
          {{ trigger.id in ['ventilate_timeout', 'restart']
             and indoor_humidity >= _target_rh and compressor_ready }}
        sequence: *turn_on

      # 5. Ventilation recommended and announced → wait for someone to open a window
      - conditions: "{{ ventilation_recommended and _ventilate_actions | count > 0 }}"
        sequence: []

      # 6. Above the target humidity → on
      - conditions: "{{ indoor_humidity >= _target_rh and compressor_ready }}"
        sequence: *turn_on

      # 7. Below the turn-off threshold → off (after the minimum run time)
      - conditions: "{{ indoor_humidity < _turn_off_rh and min_run_done }}"
        sequence: *turn_off

    # Between both thresholds (hysteresis): no branch matches, state stays as is
    default: []
