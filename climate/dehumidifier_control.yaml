blueprint:
  name: "Smart Dehumidifier Control"
  description: |
    Version 2.6

    Controls a dehumidifier dynamically using physically sound decision logic
    instead of fixed thresholds:

    - Compares indoor and outdoor absolute humidity: if ventilating would be
      more efficient (outdoor air drier AND outdoor temperature below the
      configured comfort limit), the dehumidifier stays off.
    - Optional minimum AH differential: dehumidifier only runs when indoor
      absolute humidity exceeds outdoor by a configurable margin.
    - Optional window/door sensors: dehumidifier turns off automatically
      when a window or door is opened.
    - Optional presence detection: when nobody is home, ventilation is
      ignored and the dehumidifier takes over.
    - Minimum off-time protects the compressor from short cycling.
    - Emergency override at critical indoor humidity (mold protection).
    - Hysteresis prevents rapid cycling.
    - Optional active time window.
  domain: automation
  input:
    humidifier_entity:
      name: Dehumidifier
      description: "Select the dehumidifier entity (domain: humidifier)"
      selector:
        entity:
          domain: humidifier

    indoor_sensors:
      name: Indoor Sensors
      icon: mdi:home-thermometer
      collapsed: true
      input:
        indoor_rh_sensor:
          name: Indoor – Relative Humidity
          description: Sensor for indoor relative humidity (%)
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity

        indoor_abs_sensor:
          name: Indoor – Absolute Humidity
          description: Sensor for indoor absolute humidity (g/m³)
          selector:
            entity:
              domain: sensor

    outdoor_sensors:
      name: Outdoor Sensors (optional)
      icon: mdi:weather-partly-cloudy
      collapsed: true
      input:
        outdoor_rh_sensor:
          name: Outdoor – Relative Humidity
          description: Sensor for outdoor relative humidity (%)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity

        outdoor_abs_sensor:
          name: Outdoor – Absolute Humidity
          description: >
            Sensor for outdoor absolute humidity (g/m³).
            Required to determine whether ventilating would be more efficient
            than running the dehumidifier. Without this sensor the dehumidifier
            operates based on indoor humidity only.
          default: ""
          selector:
            entity:
              domain: sensor

        outdoor_temp_sensor:
          name: Outdoor – Temperature
          description: >
            Sensor for outdoor temperature (°C).
            Required together with the outdoor absolute humidity sensor.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature

    windows_doors:
      name: Windows & Doors
      icon: mdi:window-open
      collapsed: true
      input:
        window_door_sensors:
          name: Window/Door Sensors (optional)
          description: >
            One or more window or door sensors. While at least one reports
            "open", the dehumidifier is turned off.
            Exception: emergency override at critical humidity.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class: window
                - domain: binary_sensor
                  device_class: door
                - domain: binary_sensor
                  device_class: opening

    thresholds:
      name: Thresholds
      icon: mdi:tune
      collapsed: true
      input:
        target_rh:
          name: Target Humidity (%)
          description: >
            Dehumidification is triggered above this value (comfort threshold).
          default: 55
          selector:
            number:
              min: 40
              max: 90
              step: 1
              unit_of_measurement: "%"
              mode: slider

        turn_off_rh:
          name: Turn-off Threshold – Hysteresis (%)
          description: >
            The dehumidifier only turns off once indoor humidity drops below
            this value. Must be lower than the target humidity to prevent
            rapid cycling.
          default: 50
          selector:
            number:
              min: 30
              max: 85
              step: 1
              unit_of_measurement: "%"
              mode: slider

        critical_rh:
          name: Critical Humidity – Emergency Override (%)
          description: >
            When indoor humidity exceeds this value, the dehumidifier turns on
            regardless of outdoor conditions, open windows, or presence.
            (Mold protection)
          default: 60
          selector:
            number:
              min: 50
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        min_off_time:
          name: Minimum Off Time (minutes)
          description: >
            The dehumidifier must remain off for at least this duration before
            it can turn on again. Protects the compressor from short cycling
            and improves efficiency. Recommended: 5 minutes.
          default: 5
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: "min"
              mode: slider

    presence:
      name: Presence
      icon: mdi:account-multiple
      collapsed: true
      input:
        presence_sensors:
          name: Presence Sensors (optional)
          description: >
            One or more person entities or presence/occupancy binary sensors.
            When nobody is detected as home, ventilation is not recommended
            and the dehumidifier runs instead.
            Leave empty to disable presence detection.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: person
                - domain: binary_sensor
                  device_class: presence
                - domain: binary_sensor
                  device_class: occupancy

    ventilation_logic:
      name: Ventilation Logic
      icon: mdi:air-filter
      collapsed: true
      input:
        enable_outdoor_compare:
          name: Enable Outdoor Air Comparison?
          description: >
            When enabled: the dehumidifier stays off while ventilating would
            be more efficient (outdoor absolute humidity lower than indoor AND
            outdoor temperature below the comfort limit).
            When disabled: react to indoor humidity only.
          default: true
          selector:
            boolean:

        min_ah_diff:
          name: Minimum Indoor/Outdoor AH Differential (g/m³)
          description: >
            In normal operation the dehumidifier only runs when indoor absolute
            humidity exceeds outdoor absolute humidity by at least this value.
            Prevents pointless operation when indoor and outdoor humidity are
            nearly equal and the dehumidifier would fight constant outdoor
            air infiltration.
            0 = disabled (no minimum differential required).
          default: 0
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: "g/m³"
              mode: slider

        max_comfort_temp:
          name: Maximum Comfort Temperature (°C)
          description: >
            Ventilation is only recommended when the outdoor temperature does
            not exceed this value. Ensures the apartment never heats above
            this limit through ventilation. Example: 20°C – ventilation is
            recommended at 17°C outside (17 ≤ 20) but not at 23°C (23 > 20).
          default: 20
          selector:
            number:
              min: 15
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

    time_window:
      name: Time Window
      icon: mdi:clock-outline
      collapsed: true
      input:
        enable_time_check:
          name: Enable Time Window?
          description: >
            When enabled, dehumidification only runs between the start and
            end time. Outside this window the dehumidifier is turned off.
          default: false
          selector:
            boolean:

        start_time:
          name: Start Time
          default: "09:00:00"
          selector:
            time:

        end_time:
          name: End Time
          default: "22:00:00"
          selector:
            time:

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id:
      - !input indoor_rh_sensor
      - !input indoor_abs_sensor
  - platform: state
    entity_id: !input window_door_sensors
  - platform: state
    entity_id: !input presence_sensors
  - platform: time_pattern
    minutes: "/5"

condition: []

variables:
  # Time window inputs
  enable_time_check: !input enable_time_check
  start_time: !input start_time
  end_time: !input end_time

  # Threshold inputs
  target_rh: !input target_rh
  turn_off_rh: !input turn_off_rh
  critical_rh: !input critical_rh
  min_off_time: !input min_off_time
  enable_outdoor_compare: !input enable_outdoor_compare
  min_ah_diff: !input min_ah_diff
  max_comfort_temp: !input max_comfort_temp

  # Entity IDs as variables (required for states() calls inside Jinja2 templates)
  _humidifier_id: !input humidifier_entity
  _indoor_rh_id: !input indoor_rh_sensor
  _indoor_abs_id: !input indoor_abs_sensor
  _outdoor_abs_id: !input outdoor_abs_sensor
  _outdoor_temp_id: !input outdoor_temp_sensor
  _window_sensors: !input window_door_sensors
  _presence_sensors: !input presence_sensors

  # Sensor values as numbers
  indoor_rh: "{{ states(_indoor_rh_id) | float(0) }}"
  indoor_abs: "{{ states(_indoor_abs_id) | float(0) }}"
  outdoor_abs: "{{ states(_outdoor_abs_id) | float(0) }}"

  # Time window check (supports windows spanning midnight)
  in_time_window: >
    {% if not enable_time_check %}
      true
    {% else %}
      {% set n = now().strftime('%H:%M:%S') %}
      {% if start_time < end_time %}
        {{ start_time <= n <= end_time }}
      {% else %}
        {{ n >= start_time or n <= end_time }}
      {% endif %}
    {% endif %}

  # At least one person is home
  # Empty list → true (no sensor configured = always assume someone is home)
  # Supports person entities (state: "home") and binary sensors (state: "on")
  someone_home: >
    {% if _presence_sensors | list | count == 0 %}
      true
    {% else %}
      {{ expand(_presence_sensors)
         | selectattr('state', 'in', ['home', 'on'])
         | list | count > 0 }}
    {% endif %}

  # AH differential check: indoor must exceed outdoor by at least min_ah_diff g/m³
  # Disabled (always true) when min_ah_diff=0 or outdoor sensors not configured
  ah_diff_ok: >
    {% if min_ah_diff | float(0) == 0 or not _outdoor_abs_id %}
      true
    {% else %}
      {{ indoor_abs | float >= outdoor_abs | float + min_ah_diff | float }}
    {% endif %}

  # At least one window or door is open
  # Empty list → false (no sensor configured = no effect)
  any_window_open: >
    {% if _window_sensors | list | count == 0 %}
      false
    {% else %}
      {{ expand(_window_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}
    {% endif %}

  # Compressor protection: dehumidifier may only restart after minimum off time has elapsed
  # No restriction if currently running or state is unavailable/unknown
  compressor_ready: >
    {% set h_state = states(_humidifier_id) %}
    {% if h_state in ['unavailable', 'unknown'] %}
      true
    {% elif h_state != 'off' %}
      true
    {% else %}
      {{ (now() - states[_humidifier_id].last_changed).total_seconds() >= min_off_time * 60 }}
    {% endif %}

  # Ventilation is preferred when all of the following are true:
  # 1. Outdoor sensors are configured (otherwise no comparison possible)
  # 2. Someone is home (can open/close windows)
  # 3. Outdoor AH < indoor AH (outdoor air is drier)
  # 4. Outdoor temperature ≤ max_comfort_temp (ventilating won't overheat the apartment)
  # Unconfigured or unavailable sensors → false (dehumidifier runs as fallback)
  ventilation_preferred: >
    {% if not _outdoor_abs_id or not _outdoor_temp_id %}
      false
    {% else %}
      {% set o_abs = states(_outdoor_abs_id) %}
      {% set i_abs = states(_indoor_abs_id) %}
      {% set o_temp = states(_outdoor_temp_id) %}
      {% if o_abs in ['unavailable', 'unknown', 'none']
         or i_abs in ['unavailable', 'unknown', 'none']
         or o_temp in ['unavailable', 'unknown', 'none'] %}
        false
      {% else %}
        {{ someone_home
           and enable_outdoor_compare
           and o_abs | float < i_abs | float
           and o_temp | float <= max_comfort_temp | float(20) }}
      {% endif %}
    {% endif %}

action:
  - choose:

      # Branch 1: Outside time window → turn off
      - conditions:
          - condition: template
            value_template: "{{ enable_time_check and not in_time_window }}"
        sequence:
          - action: humidifier.turn_off
            target:
              entity_id: !input humidifier_entity

      # Branch 2: Emergency override → always turn on (mold protection)
      # Applies even with open windows – compressor protection remains active
      - conditions:
          - condition: template
            value_template: "{{ indoor_rh >= critical_rh and compressor_ready }}"
        sequence:
          - action: humidifier.turn_on
            target:
              entity_id: !input humidifier_entity

      # Branch 3: Window or door open → turn off
      # Running the dehumidifier with an open window wastes energy
      - conditions:
          - condition: template
            value_template: "{{ any_window_open }}"
        sequence:
          - action: humidifier.turn_off
            target:
              entity_id: !input humidifier_entity

      # Branch 4: Normal turn-on
      # Conditions: indoor humidity above target AND ventilation would not help
      #             AND AH differential sufficient AND compressor ready
      - conditions:
          - condition: template
            value_template: >
              {{ indoor_rh >= target_rh
                 and not ventilation_preferred
                 and ah_diff_ok
                 and compressor_ready }}
        sequence:
          - action: humidifier.turn_on
            target:
              entity_id: !input humidifier_entity

      # Branch 5: Turn off (hysteresis)
      # Only turns off once humidity drops well below the target threshold
      - conditions:
          - condition: template
            value_template: "{{ indoor_rh < turn_off_rh }}"
        sequence:
          - action: humidifier.turn_off
            target:
              entity_id: !input humidifier_entity

    # Hysteresis zone (between turn_off_rh and target_rh):
    # No branch matches → no action → device stays in its current state
    default: []
