blueprint:
  name: "[OWN] Luftentfeuchter Steuerung"
  description: |
    Version 2.6

    Steuert den Luftentfeuchter dynamisch basierend auf physikalisch fundierter
    Entscheidungslogik:

    - Vergleicht absolute Außen- und Innenluftfeuchtigkeit:
      Wenn Lüften effizienter wäre (Außenluft trockener UND Außentemperatur
      unterhalb der konfigurierten Wohlfühltemperatur), bleibt der Entfeuchter aus.
    - Fenster/Tür-Sensoren: Entfeuchter schaltet automatisch ab wenn ein
      Fenster oder eine Tür geöffnet wird (mehrere Sensoren möglich).
    - Mindest-Ausschaltzeit schützt den Kompressor vor Kurzzyklen.
    - Notfall-Override bei kritisch hoher Innenfeuchte (Schimmelschutz).
    - Hysterese verhindert Taktung.
    - Optional: nur innerhalb eines Zeitfensters aktiv.
  domain: automation
  input:
    humidifier_entity:
      name: Luftentfeuchter
      description: "Wähle den Luftentfeuchter (Domain: humidifier)"
      selector:
        entity:
          domain: humidifier

    innensensoren:
      name: Innensensoren
      icon: mdi:home-thermometer
      collapsed: true
      input:
        indoor_rh_sensor:
          name: Innen – Relative Luftfeuchtigkeit
          description: Sensor für die relative Innenluftfeuchtigkeit (%)
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity

        indoor_abs_sensor:
          name: Innen – Absolute Luftfeuchtigkeit
          description: Sensor für die absolute Innenluftfeuchtigkeit (g/m³)
          selector:
            entity:
              domain: sensor

    aussensensoren:
      name: Außensensoren (optional)
      icon: mdi:weather-partly-cloudy
      collapsed: true
      input:
        outdoor_rh_sensor:
          name: Außen – Relative Luftfeuchtigkeit
          description: Sensor für die relative Außenluftfeuchtigkeit (%)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity

        outdoor_abs_sensor:
          name: Außen – Absolute Luftfeuchtigkeit
          description: >
            Sensor für die absolute Außenluftfeuchtigkeit (g/m³).
            Wird benötigt um zu entscheiden ob Lüften effizienter wäre
            als der Entfeuchter. Ohne diesen Sensor läuft der Entfeuchter
            rein basierend auf der Innenluftfeuchtigkeit.
          default: ""
          selector:
            entity:
              domain: sensor

        outdoor_temp_sensor:
          name: Außen – Temperatur
          description: >
            Sensor für die Außentemperatur (°C).
            Wird zusammen mit der absoluten Außenfeuchte benötigt.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature

    fenster_tueren:
      name: Fenster & Türen
      icon: mdi:window-open
      collapsed: true
      input:
        window_door_sensors:
          name: Fenster/Tür-Sensoren (optional)
          description: >
            Einer oder mehrere Fenster- bzw. Türsensoren. Solange mindestens einer
            davon "offen" meldet, wird der Entfeuchter ausgeschaltet.
            Ausnahme: Notfall-Override bei kritisch hoher Luftfeuchtigkeit.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class: window
                - domain: binary_sensor
                  device_class: door
                - domain: binary_sensor
                  device_class: opening

    schwellwerte:
      name: Schwellwerte
      icon: mdi:tune
      collapsed: true
      input:
        target_rh:
          name: Ziel-Luftfeuchtigkeit (%)
          description: >
            Oberhalb dieses Wertes wird Entfeuchten angestrebt (Komfortschwelle).
          default: 55
          selector:
            number:
              min: 40
              max: 90
              step: 1
              unit_of_measurement: "%"
              mode: slider

        turn_off_rh:
          name: Ausschaltwert – Hysterese (%)
          description: >
            Der Entfeuchter schaltet erst aus, wenn die Innenfeuchte diesen Wert
            unterschreitet. Sollte kleiner als die Ziel-Luftfeuchtigkeit sein,
            um Taktung zu vermeiden.
          default: 50
          selector:
            number:
              min: 30
              max: 85
              step: 1
              unit_of_measurement: "%"
              mode: slider

        critical_rh:
          name: Kritische Luftfeuchtigkeit – Notfall-Override (%)
          description: >
            Überschreitet die Innenfeuchte diesen Wert, wird der Entfeuchter
            unabhängig vom Außenluft-Vergleich, der Außentemperatur und geöffneten
            Fenstern eingeschaltet. (Schimmelschutz)
          default: 60
          selector:
            number:
              min: 50
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        min_off_time:
          name: Mindest-Ausschaltzeit (Minuten)
          description: >
            Der Entfeuchter muss nach dem Abschalten mindestens diese Zeit warten,
            bevor er wieder eingeschaltet werden kann. Schützt den Kompressor vor
            Kurzzyklen und verbessert den Wirkungsgrad.
            Empfehlung: 5 Minuten.
          default: 5
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: "min"
              mode: slider

    anwesenheit:
      name: Anwesenheit
      icon: mdi:account-multiple
      collapsed: true
      input:
        presence_sensors:
          name: Anwesenheitssensoren (optional)
          description: >
            Eine oder mehrere Personen (person-Entität) oder Präsenzsensoren
            (binary_sensor). Solange niemand als anwesend erkannt wird, wird
            Lüften nicht empfohlen und der Entfeuchter läuft stattdessen.
            Leer lassen = Anwesenheit wird nicht berücksichtigt.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: person
                - domain: binary_sensor
                  device_class: presence
                - domain: binary_sensor
                  device_class: occupancy

    lueftungslogik:
      name: Lüftungslogik
      icon: mdi:air-filter
      collapsed: true
      input:
        enable_outdoor_compare:
          name: Außenluft-Vergleich aktivieren?
          description: >
            Wenn aktiviert: Der Entfeuchter bleibt aus, solange Lüften sinnvoller
            wäre (absolute Außenfeuchte kleiner als innen UND Außentemperatur
            unterhalb der Wohlfühltemperatur). Wenn deaktiviert: nur auf
            Innenfeuchte reagieren.
          default: true
          selector:
            boolean:

        min_ah_diff:
          name: Mindest-AH-Differenz Innen/Außen (g/m³)
          description: >
            Der Entfeuchter läuft im Normalbetrieb nur wenn die absolute
            Innenluftfeuchtigkeit mindestens diesen Wert über der absoluten
            Außenluftfeuchtigkeit liegt. Verhindert sinnlosen Betrieb wenn
            Innen- und Außenluft nahezu gleich feucht sind und der Entfeuchter
            gegen den ständigen Außenluft-Eintrag ankämpfen würde.
            0 = deaktiviert (kein Mindestabstand erforderlich).
          default: 0
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: "g/m³"
              mode: slider

        max_comfort_temp:
          name: Maximale Wohlfühltemperatur (°C)
          description: >
            Lüften wird nur empfohlen, wenn die Außentemperatur diesen Wert nicht
            überschreitet. Dadurch wird die Wohnung durch Lüften niemals wärmer
            als diese Grenze. Beispiel: 23°C – bei 17°C außen und 15°C innen
            wird Lüften empfohlen (17 ≤ 23); bei 26°C außen nicht (26 > 23).
          default: 20
          selector:
            number:
              min: 15
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

    zeitfenster:
      name: Zeitfenster
      icon: mdi:clock-outline
      collapsed: true
      input:
        enable_time_check:
          name: Zeitfenster aktiv?
          description: >
            Wenn aktiviert, wird nur zwischen der Start- und Endzeit entfeuchtet.
            Außerhalb des Zeitfensters wird der Entfeuchter ausgeschaltet.
          default: false
          selector:
            boolean:

        start_time:
          name: Startzeit
          default: "09:00:00"
          selector:
            time:

        end_time:
          name: Endzeit
          default: "22:00:00"
          selector:
            time:

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id:
      - !input indoor_rh_sensor
      - !input indoor_abs_sensor
  - platform: state
    entity_id: !input window_door_sensors
  - platform: state
    entity_id: !input presence_sensors
  - platform: time_pattern
    minutes: "/5"

condition: []

variables:
  # Zeitfenster-Inputs
  enable_time_check: !input enable_time_check
  start_time: !input start_time
  end_time: !input end_time

  # Schwellwert-Inputs
  target_rh: !input target_rh
  turn_off_rh: !input turn_off_rh
  critical_rh: !input critical_rh
  min_off_time: !input min_off_time
  enable_outdoor_compare: !input enable_outdoor_compare
  min_ah_diff: !input min_ah_diff
  max_comfort_temp: !input max_comfort_temp

  # Entity-IDs als Variablen (notwendig für states()-Aufruf in Jinja2-Templates)
  _humidifier_id: !input humidifier_entity
  _indoor_rh_id: !input indoor_rh_sensor
  _indoor_abs_id: !input indoor_abs_sensor
  _outdoor_abs_id: !input outdoor_abs_sensor
  _outdoor_temp_id: !input outdoor_temp_sensor
  _window_sensors: !input window_door_sensors
  _presence_sensors: !input presence_sensors

  # Sensor-Werte als Zahlen
  indoor_rh: "{{ states(_indoor_rh_id) | float(0) }}"
  indoor_abs: "{{ states(_indoor_abs_id) | float(0) }}"
  outdoor_abs: "{{ states(_outdoor_abs_id) | float(0) }}"

  # Zeitfenster-Prüfung (unterstützt auch Zeitfenster über Mitternacht)
  in_time_window: >
    {% if not enable_time_check %}
      true
    {% else %}
      {% set n = now().strftime('%H:%M:%S') %}
      {% if start_time < end_time %}
        {{ start_time <= n <= end_time }}
      {% else %}
        {{ n >= start_time or n <= end_time }}
      {% endif %}
    {% endif %}

  # Mindestens eine Person ist daheim
  # Leere Sensor-Liste → true (kein Sensor konfiguriert = immer als anwesend annehmen)
  # Unterstützt person-Entitäten (state: "home") und binary_sensor (state: "on")
  someone_home: >
    {% if _presence_sensors | list | count == 0 %}
      true
    {% else %}
      {{ expand(_presence_sensors)
         | selectattr('state', 'in', ['home', 'on'])
         | list | count > 0 }}
    {% endif %}

  # AH-Differenz-Check: Innen muss mindestens min_ah_diff g/m³ feuchter sein als außen
  # Bei min_ah_diff=0 oder nicht konfigurierten Außensensoren: immer true (Regel deaktiviert)
  ah_diff_ok: >
    {% if min_ah_diff | float(0) == 0 or not _outdoor_abs_id %}
      true
    {% else %}
      {{ indoor_abs | float >= outdoor_abs | float + min_ah_diff | float }}
    {% endif %}

  # Mindestens ein Fenster/Tür ist offen
  # Leere Sensor-Liste → false (kein Sensor konfiguriert = kein Einfluss)
  any_window_open: >
    {% if _window_sensors | list | count == 0 %}
      false
    {% else %}
      {{ expand(_window_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}
    {% endif %}

  # Kompressor-Schutz: Entfeuchter darf erst wieder starten wenn Mindest-Ausschaltzeit abgelaufen
  # Falls Entfeuchter läuft oder Zustand unbekannt: keine Einschränkung
  compressor_ready: >
    {% set h_state = states(_humidifier_id) %}
    {% if h_state in ['unavailable', 'unknown'] %}
      true
    {% elif h_state != 'off' %}
      true
    {% else %}
      {{ (now() - states[_humidifier_id].last_changed).total_seconds() >= min_off_time * 60 }}
    {% endif %}

  # Lüften ist sinnvoll wenn:
  # 1. Außensensoren konfiguriert (sonst kein Vergleich möglich)
  # 2. Jemand ist daheim (kann Fenster öffnen/schließen)
  # 3. Außen-AH < Innen-AH (Außenluft trockener)
  # 4. Außentemperatur ≤ max_comfort_temp (Lüften heizt Wohnung nicht über Wohlfühlgrenze)
  # Nicht konfigurierte oder unavailable Sensoren → false (Entfeuchter läuft)
  ventilation_preferred: >
    {% if not _outdoor_abs_id or not _outdoor_temp_id %}
      false
    {% else %}
      {% set o_abs = states(_outdoor_abs_id) %}
      {% set i_abs = states(_indoor_abs_id) %}
      {% set o_temp = states(_outdoor_temp_id) %}
      {% if o_abs in ['unavailable', 'unknown', 'none']
         or i_abs in ['unavailable', 'unknown', 'none']
         or o_temp in ['unavailable', 'unknown', 'none'] %}
        false
      {% else %}
        {{ someone_home
           and enable_outdoor_compare
           and o_abs | float < i_abs | float
           and o_temp | float <= max_comfort_temp | float(20) }}
      {% endif %}
    {% endif %}

action:
  - choose:

      # Zweig 1: Außerhalb Zeitfenster → ausschalten
      - conditions:
          - condition: template
            value_template: "{{ enable_time_check and not in_time_window }}"
        sequence:
          - action: humidifier.turn_off
            target:
              entity_id: !input humidifier_entity

      # Zweig 2: Notfall-Override → immer einschalten (Schimmelschutz)
      # Gilt auch bei offenen Fenstern – Kompressorschutz bleibt aktiv
      - conditions:
          - condition: template
            value_template: "{{ indoor_rh >= critical_rh and compressor_ready }}"
        sequence:
          - action: humidifier.turn_on
            target:
              entity_id: !input humidifier_entity

      # Zweig 3: Fenster/Tür offen → ausschalten
      # Entfeuchten bei offenem Fenster verschwendet Energie
      - conditions:
          - condition: template
            value_template: "{{ any_window_open }}"
        sequence:
          - action: humidifier.turn_off
            target:
              entity_id: !input humidifier_entity

      # Zweig 4: Normales Einschalten
      # Bedingung: Innenfeuchte über Zielwert UND Lüften würde nicht helfen
      #            UND Kompressor hat Mindest-Ausschaltzeit eingehalten
      - conditions:
          - condition: template
            value_template: >
              {{ indoor_rh >= target_rh
                 and not ventilation_preferred
                 and ah_diff_ok
                 and compressor_ready }}
        sequence:
          - action: humidifier.turn_on
            target:
              entity_id: !input humidifier_entity

      # Zweig 5: Ausschalten (Hysterese)
      # Erst ausschalten wenn Feuchte deutlich unter Zielwert – verhindert Taktung
      - conditions:
          - condition: template
            value_template: "{{ indoor_rh < turn_off_rh }}"
        sequence:
          - action: humidifier.turn_off
            target:
              entity_id: !input humidifier_entity

    # Hysterese-Zone (zwischen turn_off_rh und target_rh):
    # Kein Zweig greift → keine Aktion → Gerät bleibt im aktuellen Zustand
    default: []
