name: Validate

on:
  push:
    branches: [main]
    paths:
      - "**/*.yaml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-yaml:
    name: YAML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install yamllint pyyaml

      - name: Lint YAML syntax
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            $(find . -name "*.yaml" -not -path "./.github/*")

      - name: Validate blueprint structure
        run: python .github/scripts/validate_blueprints.py
