name: Validate

on:
  push:
    branches: [dev, main]
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - ".github/scripts/validate_blueprints.py"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate blueprints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install yamllint pyyaml

      - name: Lint YAML syntax
        run: |
          yamllint -d "{extends: relaxed, ignore: '.github/', rules: {line-length: {max: 200}}}" .

      - name: Validate blueprint structure
        run: python .github/scripts/validate_blueprints.py
