name: Feature request
description: Suggest an improvement to a blueprint or an idea for a new one.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Good fits here: new options or behaviour changes for an existing blueprint, and ideas for new blueprints.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this has not been requested yet.
          required: true
  - type: dropdown
    id: blueprint
    attributes:
      label: Blueprint
      options:
        - Smart Dehumidifier Control (climate/dehumidifier_control.yaml)
        - Person Arrival & Departure Automation (presence/person_presence.yaml)
        - New blueprint
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what is missing or inconvenient today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should the blueprint behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you have tried.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
